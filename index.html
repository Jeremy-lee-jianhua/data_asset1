function percentile(arr, p) {
  if (!arr.length) return 0;
  const a = arr.slice().sort((x, y) => x - y);
  return a[Math.min(a.length - 1, Math.max(0, Math.ceil(p / 100 * a.length) - 1))];
}

function qualityBar(name, value, unit, desc) {
  const fill = Math.min(100, Math.max(2, value));
  return `<div class="bullet">
    <div class="bullet-hd">
      <span class="bullet-name">${name}</span>
      <span class="bullet-val"><b>${value}${unit}</b></span>
    </div>
    <div class="bullet-track"><span class="bullet-fill" style="width:${fill}%;background:#177245;opacity:.85"></span></div>
    <div class="bullet-foot"><span>${desc}</span><span></span></div>
  </div>`;
}

function qualityRow(name, desc, value, target, scale, unit, lowerBetter) {
  const ok = lowerBetter ? value <= target : value >= target;
  const fill = Math.min(100, Math.max(2, value / scale * 100));
  const mark = Math.min(100, Math.max(0, target / scale * 100));
  const color = ok ? '#177245' : (lowerBetter ? '#D08A1E' : '#B42318');
  return `<div class="bullet">
    <div class="bullet-hd">
      <span class="bullet-name">${name}</span>
      <span class="bullet-val"><b style="color:${color}">${value}${unit}</b> <span class="mini">/ 目标 ${lowerBetter ? '≤' : '≥'} ${target}${unit}</span></span>
    </div>
    <div class="bullet-track">
      <span class="bullet-fill" style="width:${fill}%;background:${color};opacity:.85"></span>
      <span class="bullet-target" style="left:${mark}%"></span>
    </div>
    <div class="bullet-foot"><span>${desc}</span><span>${ok ? '✓ 达标' : '需关注'}</span></div>
  </div>`;
}

function pageDashboard() {
  const products = DSP.db.products.filter(p => p.status === 'on');
  const datasets = (DSP.db.datasets || []).filter(d => d.status === 'on');
  const calls = DSP.db.calls;
  const okN = calls.filter(c => c.code === 0 || c.code === 46001).length;
  const badN = calls.length - okN;
  const badRate = calls.length ? (badN / calls.length * 100) : 0;
  const rate = calls.length ? (okN / calls.length * 100) : 0;
  const lat = calls.filter(c => c.code === 0 || c.code === 46001).map(c => c.latency);
  const p95 = percentile(lat, 95);
  const p99 = percentile(lat, 99);
  const totalUsed = DSP.db.grants.reduce((s2, g) => s2 + g.quota.used, 0);
  const custN = (DSP.db.customers || []).length;
  const allFields = datasets.reduce((s2, d) => s2.concat(d.fields || []), []);
  const dsPkCount = datasets.filter(d => (d.fields || []).some(f => f.pk === '是')).length;
  const dsPkRate = datasets.length ? Math.round(dsPkCount / datasets.length * 100) : 0;
  const dsDescRate = allFields.length ? Math.round(allFields.filter(f => f.desc).length / allFields.length * 100) : 0;

  const byDay = {};
  calls.forEach(c => { const d = c.at.slice(0, 10); byDay[d] = (byDay[d] || 0) + 1; });
  const dayKeys = Object.keys(byDay).sort();
  const last7 = dayKeys.slice(-7).reduce((s2, d) => s2 + byDay[d], 0);
  const prev7 = dayKeys.slice(-14, -7).reduce((s2, d) => s2 + byDay[d], 0);
  const delta = prev7 ? Math.round((last7 - prev7) / prev7 * 100) : 0;
  const days = dayKeys.length;
  const peak = Math.max(0, ...dayKeys.map(d => byDay[d]));
  const avg = days ? Math.round(calls.length / days) : 0;

  const kpi = (icon, lab, val, unit, sub, deltaHtml, page) => `<div class="card stat kpi kpi-link" data-act="go" data-page="${page}" role="link" tabindex="0" aria-label="${lab}，查看详情">
    <div class="kpi-top"><span class="kpi-ico"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></span><span class="kpi-lab">${lab}</span>
      <svg class="kpi-go" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="kpi-val">${val}<small>${unit || ''}</small></div>
    <div class="kpi-sub">${deltaHtml ? deltaHtml + '　·　' : ''}${sub}</div>
  </div>`;

  return `
  <div class="crumb">首页 / <span class="cur">总览</span></div>
  <div class="page-head"><div><h1 class="page-title">总览</h1>
    <p class="page-desc">平台服务与数据质量概况　·　${today()}</p></div></div>

  <div class="grid g4" style="margin-bottom:14px">
    ${kpi(ICON.user, '服务客户', num(custN), '家', '已开通数据资源', '', 'customers')}
    ${kpi(ICON.catalog, '数据资源', num(products.length + datasets.length), '个', `${products.length} 个产品 · ${datasets.length} 个数据集`, '', 'resources')}
    ${kpi(ICON.calls, '累计调用', num(totalUsed), '次', '全部客户合计', `<span class="kpi-delta ${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '↑' : '↓'} ${Math.abs(delta)}% 近 7 天环比</span>`, 'audit')}
    ${kpi(ICON.audit, '异常率', badRate.toFixed(1), '%', `${num(badN)} / ${num(calls.length)} 次调用`, `<span class="kpi-delta ${badRate <= 10 ? 'up' : 'down'}">${badRate <= 10 ? '在阈值内' : '高于阈值'}</span>`, 'audit')}
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-hd">
      <div class="card-title">调用趋势</div>
      <span class="mini">近 ${days} 天　·　日均 ${avg} 次　·　峰值 ${peak} 次　·　<span style="color:${delta >= 0 ? '#177245' : '#B42318'}">近 7 天环比 ${delta >= 0 ? '+' : ''}${delta}%</span></span>
    </div>
    <div class="card-bd">${trendChart(calls)}</div>
  </div>

  <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px">
    <div class="card">
      <div class="card-hd"><div class="card-title">数据质量 · 数据集</div><span class="mini">${datasets.length} 个数据集</span></div>
      <div class="card-bd">
        ${qualityBar('主键完整性', dsPkRate, '%', `${dsPkCount} / ${datasets.length} 个数据集已设主键`)}
        ${qualityBar('字段注释完整度', dsDescRate, '%', '已填写字段描述的字段占比')}
        ${qualityBar('其他字段完整性', 100 - DATA_QUALITY.nullRate, '%', '完整性＝字段值非空、必填无缺失')}
      </div>
    </div>

    <div class="card">
      <div class="card-hd"><div class="card-title">数据质量 · API</div><span class="mini">${num(calls.length)} 次调用样本</span></div>
      <div class="card-bd">
        ${qualityRow('调用成功率', '可用性 · 成功返回占比', Number(rate.toFixed(1)), SLA.rate, 100, '%', false)}
        ${qualityRow('P95 响应延迟', '性能 · 95% 请求低于该值', p95, SLA.p95, SLA.p99, 'ms', true)}
        ${qualityRow('P99 响应延迟', '性能 · 99% 请求低于该值', p99, SLA.p99, 1600, 'ms', true)}
      </div>
    </div>
  </div>`;
}

}

          <th style="width:150px">驳回时间</th><th style="width:34%">驳回原因</th><th style="width:70px" class="right">操作</th></tr></thead>
        <tbody>${list.map(a => `<tr>
          <td class="mono mini nowrap">${esc(a.id)}</td>
          <td class="one-line"><b style="font-weight:500">${esc(productOf(a.productId).name)}</b></td>
          <td class="nowrap"><span class="tag">${a.applicant === 'provider' ? '数据供给方' : '数据使用方'}</span></td>
          <td class="tnum mini nowrap">${esc(a.reviewedAt || '—')}</td>
          <td class="mini one-line" title="${esc(a.comment || '')}" style="color:#B42318">${esc(a.comment || '—')}</td>
          <td class="right"><button class="btn btn-ghost" style="font-size:12px" data-act="apprDetail" data-id="${a.id}">${a.status === 'pending' ? '审批' : '查看'}</button></td>
        </tr>`).join('')}</tbody>
      </table>` : `<table>
        <thead><tr><th style="width:172px">申请单号</th><th>产品</th><th style="width:120px">申请方</th>
          <th style="width:160px">使用范围</th><th style="width:170px">期限</th><th style="width:96px">状态</th><th style="width:70px" class="right">操作</th></tr></thead>
        <tbody>${list.map(a => `<tr>
          <td class="mono mini nowrap">${esc(a.id)}</td>
          <td class="one-line"><b style="font-weight:500">${esc(productOf(a.productId).name)}</b></td>
          <td class="nowrap"><span class="tag">${a.applicant === 'provider' ? '数据供给方' : '数据使用方'}</span></td>
          <td class="one-line mini" title="${esc(a.scope)}">${esc(a.scope.length > 12 ? a.scope.slice(0, 12) + '…' : a.scope)}</td>

          <td>${badge(APP_STATUS, a.status)}</td>
          <td class="right"><button class="btn btn-ghost" style="font-size:12px" data-act="apprDetail" data-id="${a.id}">${a.status === 'pending' ? '审批' : '查看'}</button></td>

        : emptyBox(isRej ? '暂无已驳回的申请' : apprTab === 'pending' ? '暂无待审批申请' : '暂无该状态的申请', isRej ? '使用方重新提交后将进入「待审批」' : '')}

let apprContract = null;

function openApproval(id) {
  const a = appOf(id), p = productOf(a.productId);
  const tier = p.tiers.find(t => t.name === a.tierName) || p.tiers[0];
  const pending = a.status === 'pending';
  apprContract = null;
  modal({
    title: '授权审批 · ' + a.id, width: 760, bodyClass: 'pm-bd',
    body: `
      <div class="pm-body">
        <section class="pm-sec">
          <div class="pm-sec-hd"><h4>申请信息</h4><span class="pm-sec-sub">使用方提交，不可修改</span></div>
          <div style="padding-bottom:14px">
            ${kv([
              ['产品', esc(p.name) + '　<span class="mono mini">' + esc(p.code) + '</span>'],
              ['覆盖接口', (p.apis || []).length + ' 个　<span class="mini">（整体授权，额度合并计算）</span>'],
              ['申请方', a.applicant === 'provider' ? '数据供给方（李工）' : '云帆低空物流科技有限公司'],
              ['应用场景', esc(a.useScene || a.purpose || '—')],
              ['接入系统', esc(a.systemName || '—')],
              ['对接人', a.contact ? esc(a.contact.name) + '　<span class="mini">' + esc(a.contact.phone) + '　' + esc(a.contact.email) + '</span>' : '—'],
              ['使用范围', esc(a.scope)],
              ['订阅套餐', esc(tier.name) + '　<span class="mini">（' + tier.months + ' 个月）</span>'],
              ['授权期限', esc(a.period.start) + ' 至 ' + esc(a.period.end)],
              ['周期内含次数', num(tier.cap) + ' 次　<span class="mini">超出 ' + tier.overage + ' 元/次</span>'],
              ['产品价格', '<b style="color:#177245">¥0</b>']

          </div>
        </section>

        ${pending ? `
        <section class="pm-sec">
          <div class="pm-sec-hd"><h4>审批处理</h4><span class="pm-sec-sub">上传线下签署的合同协议后方可开通</span></div>
          <div class="form-row"><label><i>*</i>合同协议</label>
            <div style="display:flex;align-items:center;gap:12px">
              <label class="btn btn-sm" style="margin:0;cursor:pointer">上传合同协议
                <input type="file" id="apprFile" accept=".pdf,.doc,.docx,.jpg,.png" style="display:none">
              </label>
              <span class="mini" id="contractName">未上传</span>
            </div>
            <div class="hint">支持 PDF / Word / 图片，作为授权依据留存；上传并填写审批意见后提交，即完成授权并生成授权码</div>
          </div>
          <div class="form-row"><label><i>*</i>审批意见</label>
            <textarea id="ac" placeholder="请说明审批结论与依据"></textarea></div>
        </section>` : `
        <section class="pm-sec">
          <div class="pm-sec-hd"><h4>审批结果</h4></div>
          <div style="padding-bottom:14px">
            ${kv([
              ['审批结论', badge(APP_STATUS, a.status)],
              ['审批意见', esc(a.comment || '—')],
              ['合同协议', a.contract ? '<span class="mini">' + esc(a.contract.name) + '　·　' + esc(a.contract.size) + '</span>' : '—'],
              ['授权码', a.authCode ? '<span class="mono">' + esc(a.authCode) + '</span>' : '—'],
              ['审批时间', esc(a.reviewedAt || '—') + '　<span class="mini">' + esc(a.reviewer || '') + '</span>']
            ])}
          </div>
        </section>`}
      </div>`,
    footer: pending
      ? `<button class="btn" data-act="closeModal">关闭</button>
         <button class="btn" style="color:#B42318;border-color:#F6CFCA" data-act="rejectApp" data-id="${a.id}">驳回</button>
         <button class="btn btn-primary" data-act="approveApp" data-id="${a.id}">提交并开通</button>`
      : `<button class="btn btn-primary" data-act="closeModal">关闭</button>`
  });
}

function approveApp(id) {
  const c = (($('#ac') || {}).value || '').trim();
  if (!apprContract) { toast('请先上传合同协议', 'err'); return; }
  if (!c) { toast('请填写审批意见', 'err'); return; }
  const a = appOf(id), p = productOf(a.productId);
  const exist = DSP.db.grants.find(g => g.productId === a.productId && g.applicant === a.applicant && g.status === 'active');
  if (exist) { toast('该产品已有生效授权（' + exist.id + '），同一产品对同一账号只能授权一次', 'err'); return; }
  const tier = p.tiers.find(t => t.name === a.tierName) || p.tiers[0];
  const gid = 'G-' + ymd() + '-' + String(DSP.db.grants.length + 1).padStart(3, '0');
  const authCode = 'AUTH-' + ymd() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  a.status = 'approved'; a.reviewedAt = nowStr(); a.reviewer = '平台运营 · 王审核';
  a.comment = c; a.contract = apprContract; a.authCode = authCode;
  pushOpLog('授权审批通过', '《' + p.name + '》/ ' + a.id, '签发授权单 ' + gid);
  DSP.db.grants.push({
    id: gid, applicationId: a.id, productId: a.productId, applicant: a.applicant,
    org: a.applicant === 'consumer' ? account('consumer').org : '数据供给方',
    status: 'active', activatedAt: a.period.start + ' 00:00', expiresAt: a.period.end,
    cap: tier.cap, overage: tier.overage, quota: { type: '周期内', used: 0 },
    authCode, contract: apprContract,
    credential: { clientId: 'ak_live_' + Math.random().toString(16).slice(2, 10), key: '••••••••••••', createdAt: today() }
  });
  DSP.db.messages.unshift({
    id: 'M' + Date.now(), to: 'consumer', type: '授权', title: `《${p.name}》授权已开通`,
    body: `授权码 ${authCode}，授权单 ${gid} 已生效，有效期至 ${a.period.end}。可前往「调用统计」查看授权码、下载 SDK 并调用接口。`,
    at: nowStr(), read: false
  });
  DSP.save(); closeModal(); toast('已开通，授权码 ' + authCode, 'ok'); render();
}

function rejectApp(id) {
  const c = (($('#ac') || {}).value || '').trim();
  if (!c) { toast('请填写驳回理由', 'err'); return; }
  const a = appOf(id);
  a.status = 'rejected'; a.reviewedAt = nowStr(); a.reviewer = '平台运营 · 王审核'; a.comment = c;
  pushOpLog('授权审批驳回', '《' + productOf(a.productId).name + '》/ ' + a.id, c);
  DSP.save(); closeModal(); toast('已驳回该申请', 'ok'); render();
}

/* ---------------- 调用统计 ---------------- */
let auditPid = '', auditKw = '', auditSupplier = 'all', auditCaller = 'all';

const AUDIT_TIPS = {
  total: '按授权单的额度用量汇总，包含已结束授权的历史调用。',
  rate: '最近调用日志中返回成功或「样本不足」的比例；越界、超限等被策略引擎拦截的请求计为失败。',
  reject: '被策略引擎直接拒绝的调用，包含超出空间范围（40302）与超出调用限制（42901）。',
  latency: '平台侧观测到的接口平均响应时间，包含网络传输与策略计算耗时。'
};

const callerName = a => a === 'provider' ? '数据供给方（李工）' : '云帆低空物流科技有限公司';

function statTip(key) {
  return `<span class="tip" data-tip="${esc(AUDIT_TIPS[key])}" style="margin-left:5px;color:#98A2B3;cursor:help;font-size:11px;vertical-align:1px">ⓘ</span>`;
}

function auditStats(calls) {
  const ok = calls.filter(c => c.code === 0 || c.code === 46001).length;
  const reject = calls.filter(c => c.code === 40302 || c.code === 42901).length;
  const avg = calls.length ? Math.round(calls.reduce((s2, c) => s2 + c.latency, 0) / calls.length) : 0;
  return { n: calls.length, ok, reject, avg };
}

function pageConsumerAudit() {
  if (auditPid) return pageAuditProduct(auditPid);
  const org = account('consumer').org;
  const calls = DSP.db.calls.filter(c => orgOfCall(c) === org);
  const grants = DSP.db.grants.filter(g => orgOfGrant(g) === org);
  const okN = calls.filter(c => c.code === 0 || c.code === 46001).length;
  const rate = calls.length ? okN / calls.length * 100 : 0;
  const lat = calls.filter(c => c.code === 0 || c.code === 46001).map(c => c.latency);
  const used = grants.reduce((s2, g) => s2 + g.quota.used, 0);
  const pids = Array.from(new Set(grants.map(g => g.productId)));
  const prodRows = pids.map(id => {
    const p = productOf(id);
    const rs = calls.filter(c => c.productId === id);
    const ok = rs.filter(c => c.code === 0 || c.code === 46001).length;
    const avg = rs.length ? Math.round(rs.reduce((s2, c) => s2 + c.latency, 0) / rs.length) : 0;
    return { p, n: rs.length, ok, avg };
  });
  const byProd = {};
  calls.forEach(c => { const n = productOf(c.productId).name; byProd[n] = (byProd[n] || 0) + 1; });
  const prodItems = Object.keys(byProd).map(k => ({ label: k, value: byProd[k] })).sort((a, b) => b.value - a.value);

  return `
  <div class="crumb">首页 / <span class="cur">调用监控</span></div>
  <div class="page-head"><div><h1 class="page-title">调用监控</h1>
    <p class="page-desc">${esc(org)} 的数据资源调用情况</p></div></div>

  <div class="grid g4" style="margin-bottom:14px">
    <div class="card stat"><div class="lab">本周期调用</div><div class="val">${num(used)}<small>次</small></div><div class="sub">已开通 ${grants.length} 项授权</div></div>
    <div class="card stat"><div class="lab">调用成功率</div><div class="val" style="color:${rate >= SLA.rate ? '#177245' : '#B42318'}">${calls.length ? rate.toFixed(1) : '—'}<small>%</small></div><div class="sub">近 ${num(calls.length)} 条调用</div></div>
    <div class="card stat"><div class="lab">已开通产品</div><div class="val">${new Set(grants.map(g => g.productId)).size}<small>个</small></div><div class="sub">${grants.filter(g => grantState(g) === 'active').length} 项授权启用中</div></div>
    <div class="card stat"><div class="lab">平均耗时</div><div class="val">${lat.length ? Math.round(lat.reduce((a, b) => a + b, 0) / lat.length) : '—'}<small>ms</small></div><div class="sub">平台侧观测</div></div>
  </div>

  <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:stretch">
    <div class="card">
      <div class="card-hd"><div class="card-title">调用趋势</div><span class="mini">近 15 天 · 共 ${num(calls.length)} 次调用</span></div>
      <div class="card-bd">${trendChart(calls)}</div>
    </div>
    <div class="card" style="min-width:0;display:flex;flex-direction:column">
      <div class="card-hd"><div class="card-title">产品调用占比</div><span class="mini">${prodItems.length} 个产品</span></div>
      <div class="card-bd" style="flex:1;display:flex;align-items:center">${pieChart(prodItems, { compact: true, withLabel: true })}</div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><div class="card-title">已开通的数据产品</div><span class="mini">${prodRows.length} 个 · 点击查看调用明细</span></div>
    <div class="card-bd">
      ${prodRows.length ? `<div class="grid g3" style="align-items:start">
        ${prodRows.map(r => `<div class="card prod-card" data-act="auditOpen" data-id="${r.p.id}" role="button" tabindex="0">
          <div class="prod-top">
            <div style="min-width:0">
              <div class="prod-name">${esc(r.p.name)}</div>
              <div class="prod-code">${esc(r.p.code)}</div>
            </div>
            <span class="badge blue">API${(r.p.apis || []).length > 1 ? ' · ' + r.p.apis.length : ''}</span>
          </div>
          <div class="mini" style="margin:7px 0 10px">供应方 · ${esc(r.p.supplier || '—')}</div>
          <div class="prod-meta">
            <div><b>${num(r.n)}</b>调用量</div>
            <div><b>${r.n ? r.ok + '/' + r.n : '—'}</b>样本成功</div>
            <div><b>${r.avg ? r.avg + 'ms' : '—'}</b>平均耗时</div>
          </div>
          <div class="prod-foot" style="justify-content:flex-end"><span class="btn btn-sm">查看详情</span></div>
        </div>`).join('')}
      </div>` : emptyBox('暂无已开通的数据产品')}
    </div>
  </div>`;
}

function pageAudit() {
  if (auditPid) return pageAuditProduct(auditPid);
  const calls = DSP.db.calls;
  const products = DSP.db.products.filter(p => p.status === 'on');
  const suppliers = Array.from(new Set(products.map(p => p.supplier || '—')));
  const callers = Array.from(new Set(calls.map(c => orgOfCall(c))));
  const list = products
    .filter(p => !auditKw || (p.name + p.code).indexOf(auditKw) > -1)
    .filter(p => auditSupplier === 'all' || p.supplier === auditSupplier)
    .filter(p => auditCaller === 'all' || calls.some(c => c.productId === p.id && orgOfCall(c) === auditCaller));

  const all = auditStats(calls);
  const usedTotal = DSP.db.grants.reduce((s2, g) => s2 + g.quota.used, 0);

  const dayKeys = Array.from(new Set(calls.map(c => c.at.slice(0, 10)))).sort();
  const endDay = dayKeys[dayKeys.length - 1] || today();
  const fmtDay = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  const endT = new Date(endDay + 'T00:00:00');
  const weekDays = [];
  for (let i = 6; i >= 0; i--) { const dt = new Date(endT); dt.setDate(dt.getDate() - i); weekDays.push(fmtDay(dt)); }
  const week = calls.filter(c => weekDays.indexOf(c.at.slice(0, 10)) > -1);

  const byProd = {};
  week.forEach(c => { const nm = productOf(c.productId).name; byProd[nm] = (byProd[nm] || 0) + 1; });
  const prodItems = Object.keys(byProd).map(k => ({ label: k, value: byProd[k] })).sort((a, b) => b.value - a.value);

  return `
  <div class="crumb">首页 / <span class="cur">调用监控</span></div>
  <div class="page-head">
    <div><h1 class="page-title">调用监控</h1>
      <p class="page-desc">全平台调用量、与按产品维度的实时监控</p></div>
    <button class="btn" data-act="exportAudit">导出统计报表</button>
  </div>

  <div class="grid g4" style="margin-bottom:14px">
    <div class="card stat"><div class="lab">累计调用量${statTip('total')}</div><div class="val">${num(usedTotal)}<small>次</small></div><div class="sub">全部客户调用合计</div></div>
    <div class="card stat"><div class="lab">调用成功率${statTip('rate')}</div><div class="val">${all.n ? (all.ok / all.n * 100).toFixed(1) : '—'}<small>%</small></div><div class="sub">近 ${all.n} 条日志</div></div>
    <div class="card stat"><div class="lab">策略拒绝${statTip('reject')}</div><div class="val">${all.reject}<small>次</small></div><div class="sub">越界与超限</div></div>
    <div class="card stat"><div class="lab">平均耗时${statTip('latency')}</div><div class="val">${all.n ? all.avg : '—'}<small>ms</small></div><div class="sub">平台侧观测</div></div>
  </div>

  <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:stretch">
    <div class="card">
      <div class="card-hd"><div class="card-title">调用趋势</div><span class="mini">近 7 天 · 共 ${num(week.length)} 次调用</span></div>
      <div class="card-bd">${trendChart(week)}</div>
    </div>
    <div class="card" style="min-width:0;display:flex;flex-direction:column">
      <div class="card-hd"><div class="card-title">产品调用占比</div><span class="mini">${prodItems.length} 个产品</span></div>
      <div class="card-bd" style="flex:1;display:flex;align-items:center">${pieChart(prodItems, { compact: true, withLabel: true })}</div>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-bd" style="padding:14px 18px">
      <div class="filter">
        <input class="input" id="akw" placeholder="按产品名称或编号筛选" value="${esc(auditKw)}" style="width:220px">
        <select class="select" id="asup" style="width:170px">
          <option value="all">全部供应方</option>
          ${suppliers.map(x => `<option value="${esc(x)}" ${auditSupplier === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}
        </select>
        <select class="select" id="acal" style="width:220px">
          <option value="all">全部调用方</option>
          ${callers.map(x => `<option value="${esc(x)}" ${auditCaller === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}
        </select>
        <div style="margin-left:auto;color:#98A2B3;font-size:12.5px">共 ${list.length} 个产品</div>
      </div>
    </div>
  </div>

  ${list.length ? `<div class="grid g3">${list.map(p => {
    const rows = calls.filter(c => c.productId === p.id);
    const st = auditStats(rows);
    const cs = Array.from(new Set(rows.map(c => orgOfCall(c))));
    return `<div class="card prod-card" data-act="auditOpen" data-id="${p.id}">
      <div class="prod-top">
        <div style="min-width:0">
          <div class="prod-name">${esc(p.name)}</div>
          <div class="prod-code">${esc(p.code)}</div>
        </div>
        <span class="badge blue">API${(p.apis || []).length > 1 ? ' · ' + p.apis.length : ''}</span>
      </div>

let auditTab = 'overview';
let auditApi = 'all';

function apiCount(v) {
  if (Array.isArray(v)) return v.length;
  if (typeof v === 'string' && v.trim()) return v.split('、').filter(Boolean).length;
  return 0;
}

function pageAuditProduct(pid) {
  const p = productOf(pid);

  const allRows = DSP.db.calls.filter(c => c.productId === pid && (!scopeOrg || orgOfCall(c) === scopeOrg));
  const multi = apis.length > 1;
  const curApi = multi ? (apis.some(a => a.path === auditApi) ? auditApi : 'all') : (apis[0] ? apis[0].path : 'all');
  const rows = (multi && curApi === 'all') || !apis.length ? allRows : allRows.filter(c => c.endpoint.indexOf(curApi) > -1);
  const apiObj = apis.find(a => a.path === curApi);
  const st = auditStats(rows);
  const perApi = apis.map(a => {
    const rs = allRows.filter(c => c.endpoint.indexOf(a.path) > -1);
    return { a, n: rs.length, ok: rs.filter(c => c.code === 0 || c.code === 46001).length,
      avg: rs.length ? Math.round(rs.reduce((s2, c) => s2 + c.latency, 0) / rs.length) : 0 };

        <span class="mono" style="margin-left:8px">${esc(apis[0] ? apis[0].method + ' ' + apis[0].path : '')}</span>
        <span style="margin-left:10px">共 ${num(st.n)} 次调用</span></div>`}

function saveNewMember() {
  const v = id => (($('#' + id) || {}).value || '').trim();
  const roles = Array.from(document.querySelectorAll('.nrole')).filter(x => x.checked).map(x => x.value);
  const name = v('mName'), accountName = v('mAccount');
  if (!name) return toast('请填写姓名', 'err');
  if (!/^[A-Za-z0-9_]{3,20}$/.test(accountName)) return toast('账号需为 3–20 位字母、数字或下划线', 'err');
  if (DSP.db.members.some(m => m.account === accountName)) return toast('该账号已存在', 'err');
  if (!v('mPhone')) return toast('请填写手机号', 'err');
  if (!v('mOrg')) return toast('请填写所属单位', 'err');
  if (!roles.length) return toast('请至少选择一个身份', 'err');
  const pwd = v('mPwd');
  if (!/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8}$/.test(pwd)) return toast('初始密码需为 8 位字母与数字组合', 'err');
  pushMsg({ to: 'operator', type: '客户', level: '普通',
    title: `新客户开通：${v('mOrg')}`,
    body: `联系人 ${name}，账号 ${accountName}，已分配身份：${roles.map(r => ROLE_NAME[r] || r).join('、')}。`,
    refType: 'customer', refId: v('mOrg') });
  DSP.db.members.unshift({
    id: 'U-' + ymd() + '-' + String(DSP.db.members.length + 1).padStart(3, '0'),
    name, account: accountName, roles, org: v('mOrg'),
    phone: v('mPhone'), email: v('mEmail'), regAt: nowStr(), lastAt: '—',
    status: v('mStatus') || 'active', password: pwd, createdBy: '平台运营 · 王审核'
  });
  pushOpLog('新增系统用户', name + ' / ' + accountName, '角色：' + roles.map(x => ROLE_NAME[x]).join('、'));
  DSP.save(); closeModal();
  toast('账号已开通，请将初始密码告知用户', 'ok');
  render();
}

function saveMemberRoles(id) {
  const m = memberOf(id);
  if (m.roles.indexOf('operator') > -1) { toast('平台运营方为内置账号，角色不可调整', 'err'); return; }
  const roles = Array.from(document.querySelectorAll('.mrole')).filter(x => x.checked).map(x => x.value)
    .filter(r => r === 'user' || r === 'provider');
  if (!roles.length) { toast('至少保留一个角色', 'err'); return; }
  m.roles = roles;
  pushOpLog('调整角色', m.name + ' / ' + m.account, '角色：' + roles.map(x => ROLE_NAME[x]).join('、'));
  DSP.save(); closeModal(); toast('角色已更新', 'ok'); render();
}

function toggleMember(id) {
  const m = memberOf(id);
  if (m.account === 'admin1') { toast('不能停用当前登录账号', 'err'); return; }
  m.status = m.status === 'active' ? 'disabled' : 'active';
  pushOpLog(m.status === 'active' ? '启用账号' : '停用账号', m.name + ' / ' + m.account, '');
  DSP.save();
  toast(m.status === 'active' ? '已启用该账号' : '已停用该账号，将无法登录', 'ok');
  render();
}

function resetMemberPwd(id) {
  const m = memberOf(id);

/* ---------------- 日志管理 ---------------- */
let logTab = 'login';

function sdkAnchor(p, cls) {
  const k = sdkInfo(p);
  const c = cls || 'btn';
  if (k.isLink) return `<a class="${c}" href="${esc(k.url)}" target="_blank" rel="noopener">打开下载链接</a>`;
  return `<button class="${c}" data-act="sdk" data-id="${p.id}">下载 SDK</button>`;
}

function sdkInfo(p) {
  const k = (p && p.sdk) || {};
  if (k.type === 'link' && k.url) return { isLink: true, url: k.url, title: '外部下载链接', sub: k.url };
  if (!k.name) return { isLink: false, title: '未上传', sub: '' };
  return { isLink: false, title: k.name, sub: [k.size, k.at ? '更新于 ' + k.at : ''].filter(Boolean).join('　·　') };
}

function pushHistory(p, action, note) {
  if (!p.history) p.history = [];
  const isOp = state.role === 'operator';
  p.history.push({
    at: nowStr(), action,
    by: isOp ? '王审核' : account('provider').name,
    role: isOp ? '平台运营方' : '数据供给方',
    note: note || ''
  });
}

function pushOpLog(action, target, note) {
  if (!DSP.db.opLogs) DSP.db.opLogs = [];
  DSP.db.opLogs.unshift({ at: nowStr(), name: account('operator').name, role: 'operator', action, target, result: 'success', note: note || '' });
  DSP.db.opLogs = DSP.db.opLogs.slice(0, 100);
}
function pushLoginLog(result, reason, who) {
  if (!DSP.db.loginLogs) DSP.db.loginLogs = [];
  const m = who || {};
  DSP.db.loginLogs.unshift({
    at: nowStr(), name: m.name || '—', account: m.account || '—',

        <div>
          <div style="font-size:13px;color:#1D2939">供给方即当前平台运营方</div>
          <div class="mini" style="margin-top:8px;line-height:1.9">
            本期供给者的能力由运营方统一承担，<br>不单独分配菜单与功能权限

/* ================================================================
   交互
   ================================================================ */
function switchRole(role) {
  state.role = LOCKED_ROLE;
  state.page = defaultPageFor(role);
  state.param = '';
  state.navGroups = {};
  if (location.hash !== '#/' + state.page) location.hash = '#/' + state.page;
  render();
}

function togglePerm(role, key) {
  if (!DSP.db.rolePerms[role]) DSP.db.rolePerms[role] = {};
  const next = !permOf(role, key);
  if (!next) {
    const rest = PERM_MENUS[role].filter(m => m.key !== key && permOf(role, m.key)).length;
    if (!rest) { toast('至少保留一个可用菜单', 'err'); return; }
  }
  DSP.db.rolePerms[role][key] = next;
  pushOpLog('权限分配', (role === 'user' ? '使用方' : '供给方') + '菜单 · ' + ((PERM_MENUS[role].find(m => m.key === key) || {}).name || key), next ? '开启' : '关闭');
  DSP.save(); toast(next ? '已开启该菜单' : '已关闭该菜单', 'ok'); render();
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const linkEl = e.target.closest && e.target.closest('[role="link"][data-act]');
  if (!linkEl) return;
  e.preventDefault();
  linkEl.click();
});

document.addEventListener('click', e => {
  const roleBtn = e.target.closest('#roleSwitch button');
  if (roleBtn) { switchRole(roleBtn.dataset.role); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  switch (act) {
    case 'go': go(el.dataset.page, el.dataset.param); break;
    case 'closeModal': closeModal(); break;
    case 'mask': if (e.target.classList.contains('mask')) closeModal(); break;
    case 'navGroup':
      state.navGroups[el.dataset.g] = !el.classList.contains('open');
      renderNav(); break;
    case 'openApply': openApply(id); break;
    case 'applyTier': {
      const p2 = productOf(applyPid);
      applyTier = Number(el.dataset.i);
      const k2 = p2.tiers[applyTier] || p2.tiers[0];
      document.querySelectorAll('.apply-tier').forEach(b => b.classList.toggle('on', Number(b.dataset.i) === applyTier));
      const pe = $('#apPrice'); if (pe) pe.textContent = '/ ' + k2.months + ' 个月　·　周期内含 ' + num(k2.cap) + ' 次';
      const pd = $('#apPeriod'); if (pd) pd.value = today() + ' 至 ' + addMonths(today(), k2.months);
      break;
    }
    case 'submitApply': submitApply(); break;
    case 'appFilter': appFilter = el.dataset.v; render(); break;
    case 'appDetail': openAppDetail(id); break;
    case 'callOpen': {
      callGid = el.dataset.id; callTab = 'overview';
      const st = LOG_STATE.call; st.page = 1; st.from = ''; st.to = ''; st.res = 'all';
      render(); break;
    }
    case 'callTab': callTab = el.dataset.v; render(); break;
    case 'logPage': { const st = LOG_STATE[el.dataset.pfx]; st.page = Number(el.dataset.v); render(); break; }
    case 'logReset': { const st = LOG_STATE[el.dataset.pfx]; st.from = ''; st.to = ''; st.res = 'all'; st.page = 1; render(); break; }
    case 'callBack': callGid = ''; callTab = 'overview'; render(); break;
    case 'sdk': {
      const sp = productOf(el.dataset.id);
      const si = sdkInfo(sp);
      if (si.isLink) { window.open(si.url, '_blank', 'noopener'); toast('已打开外部下载链接', 'ok'); break; }
      const nm = (sp.sdk && sp.sdk.name) || (sp.name + '-sdk.zip');
      const body = '数据服务产品 SDK（演示包）\n\n产品：' + sp.name + '\n编号：' + sp.code + '\n接口：' + (sp.apis || []).map(a => a.method + ' ' + a.path).join('\n') + '\n';
      const blob = new Blob([body], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const aEl = document.createElement('a');
      aEl.href = url; aEl.download = nm; document.body.appendChild(aEl); aEl.click(); aEl.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('SDK 下载已开始', 'ok');
      break;
    }
    case 'contract': toast('合同协议下载已开始（演示环境不产生实际文件）', 'ok'); break;
    case 'credential': openCredential(); break;
    case 'readMsg': {
      const m = DSP.db.messages.find(x => x.id === id);
      if (!m) break;
      if (!m.read) { m.read = true; DSP.save(); }
      render();
      openMsgModal(m);

    }
    case 'msgGo': {

      break;

    case 'changePwd': openChangePwd(); break;
    case 'submitPwd': submitPwdChange(); break;
    case 'refreshCaptcha': state.captcha = genCaptcha(); drawCaptcha(); break;
    case 'login': doLogin(); break;
    case 'logout': state.loggedIn = false; DSP.db.loginAs = ''; DSP.save(); sessionStorage.removeItem('dsp.v1.login'); go('catalog'); break;

      renderApiList(); break;
    }

      formApis[Number(el.dataset.i)].params.splice(Number(el.dataset.j), 1);
      renderApiList(); break;
    }
    case 'delField': {
      syncFormApis();
      formApis[Number(el.dataset.i)].fields.splice(Number(el.dataset.j), 1);
      renderApiList(); break;
    }
    case 'addApi': {

    case 'newRes': openNewRes(); break;
    case 'newProd': closeModal(); openProdForm(null, { mode: 'operator' }); break;
    case 'newDataset': closeModal(); openDatasetForm(); break;
    case 'saveDataset': saveDatasetForm(); break;
    case 'addDsField': {
      const box = $('#dsFields');
      if (box) box.insertAdjacentHTML('beforeend', dsFieldRowHTML());
      break;
    }
    case 'delDsField': {
      const row = el.closest('.df-row');
      const box = $('#dsFields');
      if (row && box && box.querySelectorAll('.df-row').length > 1) row.remove();
      else toast('至少保留一行数据项', 'err');
      break;
    }
    case 'grantKey': openGrantKey(el.dataset.id); break;
    case 'copyKey': toast('Client ID 已复制（演示环境不写入剪贴板）', 'ok'); break;
    case 'grantToggle': {
      const g2 = DSP.db.grants.find(x => x.id === el.dataset.id);
      if (!g2) break;
      modal({
        title: '停用调用 · ' + productOf(g2.productId).name, width: 500,
        body: `<div class="hint">停用后该客户将无法调用此产品，密钥保留，可随时启用恢复。</div>
          ${kv([['客户', esc(orgOfGrant(g2))], ['产品', esc(productOf(g2.productId).name)], ['有效期至', esc(g2.expiresAt || '—')]])}
          <div class="form-row" style="margin-top:12px"><label><i>*</i>停用说明</label>
            <textarea id="suspendNote" placeholder="说明停用原因，将记入操作记录并同步给客户"></textarea>
          </div>`,
        footer: `<button class="btn" data-act="closeModal">取消</button>
          <button class="btn btn-primary" style="background:#D08A1E;border-color:#D08A1E" data-act="grantSuspendOk" data-id="${g2.id}">确认停用</button>`
      });
      break;
    }
    case 'grantSuspendOk': {
      const g5 = DSP.db.grants.find(x => x.id === el.dataset.id);
      if (!g5) break;
      const note = (($('#suspendNote') || {}).value || '').trim();
      if (!note) { toast('请填写停用说明', 'err'); break; }
      g5.status = 'suspended';
      pushMsg({ to: 'consumer', org: orgOfGrant(g5), type: '授权', level: '重要',
        title: `授权已停用：《${productOf(g5.productId).name}》`,
        body: note + '　停用时间 ' + nowStr().slice(0, 16) + '。密钥保留，可随时恢复。',
        refType: 'grant', refId: g5.id });
      pushGrantLog(g5, '停用调用', note);
      pushOpLog('停用调用', orgOfGrant(g5) + ' / ' + productOf(g5.productId).name, note);
      DSP.save(); closeModal(); toast('已停用调用', 'ok'); render(); break;
    }
    case 'grantRevoke': {
      const g3 = DSP.db.grants.find(x => x.id === el.dataset.id);
      if (!g3) break;
      modal({
        title: '终止调用 · ' + productOf(g3.productId).name, width: 500,
        body: `<div class="hint">终止后该客户将无法再调用此产品，且不可恢复；如需恢复需重新开通。</div>
          ${kv([['客户', esc(orgOfGrant(g3))], ['产品', esc(productOf(g3.productId).name)], ['本周期调用', num(g3.quota.used) + ' 次']])}
          <div class="form-row" style="margin-top:12px"><label><i>*</i>终止说明</label>
            <textarea id="revokeNote" placeholder="说明终止原因，将记入操作记录并同步给客户"></textarea>
          </div>`,
        footer: `<button class="btn" data-act="closeModal">取消</button>
          <button class="btn btn-primary" style="background:#B42318;border-color:#B42318" data-act="grantRevokeOk" data-id="${g3.id}">确认终止</button>`
      });
      break;
    }
    case 'grantRevokeOk': {
      const g4 = DSP.db.grants.find(x => x.id === el.dataset.id);
      if (!g4) break;
      const rnote = (($('#revokeNote') || {}).value || '').trim();
      if (!rnote) { toast('请填写终止说明', 'err'); break; }
      g4.status = 'revoked';
      pushMsg({ to: 'consumer', org: orgOfGrant(g4), type: '授权', level: '重要',
        title: `授权已终止：《${productOf(g4.productId).name}》`,
        body: rnote + '　密钥已失效，如需恢复需重新开通。',
        refType: 'grant', refId: g4.id });
      pushGrantLog(g4, '终止调用，密钥失效', rnote);
      pushOpLog('终止调用', orgOfGrant(g4) + ' / ' + productOf(g4.productId).name, rnote);
      DSP.save(); closeModal(); toast('已终止调用，密钥立即失效', 'ok'); render(); break;
    }
    case 'auditBack': auditPid = ''; render(); break;
    case 'exportAudit': toast('统计报表已生成（演示环境不产生实际文件）', 'ok'); break;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'dRangeOngoing') {
    const endEl = $('#dRangeEnd');
    if (endEl) { endEl.disabled = e.target.checked; if (e.target.checked) endEl.value = ''; }
    return;
  }
  if (e.target.id === 'dScopeAll') {
    const on = e.target.checked;
    document.querySelectorAll('#dScope .dscope-child').forEach(k => { k.checked = on; });
    syncScope(); return;
  }
  if (e.target.classList && e.target.classList.contains('dscope-child')) { syncScope(); return; }
  if (/^(call|pv|au)(From|To|Res)$/.test(e.target.id)) {
    const m = e.target.id.match(/^(call|pv|au)(From|To|Res)$/);
    const st = LOG_STATE[m[1]];
    if (m[2] === 'From') st.from = e.target.value;
    if (m[2] === 'To') st.to = e.target.value;
    if (m[2] === 'Res') st.res = e.target.value;
    st.page = 1; render(); return;
  }
  if (e.target.id === 'apprFile') {
    const f = e.target.files && e.target.files[0];
    apprContract = f ? { name: f.name, size: (f.size / 1024 / 1024).toFixed(2) + ' MB', at: nowStr() } : null;
    const el = $('#contractName');
    if (el) {
      el.textContent = apprContract ? apprContract.name + '　·　' + apprContract.size : '未上传';
      el.style.color = apprContract ? '#177245' : '';
    }
    return;
  }
  if (e.target.id === 'asup') { auditSupplier = e.target.value; render(); }
  if (e.target.id === 'acal') { auditCaller = e.target.value; render(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'akw') {
    const v = e.target.value; auditKw = v.trim(); render();
    const el = $('#akw'); if (el) { el.focus(); el.value = v; el.setSelectionRange(v.length, v.length); }
    return;
  }
  if (e.target.id !== 'ckw') return;
  const v = e.target.value;
  catKw = v.trim(); render();
  const el = $('#ckw');
  if (el) { el.focus(); el.value = v; el.setSelectionRange(v.length, v.length); }
});

window.addEventListener('hashchange', () => render());

/* 供方产品详情（供给方角度） */
function confirmDelProd(id) {
  const p = productOf(id);
  modal({
    title: '删除产品 · ' + p.name, width: 460,
    body: `<div class="hint">删除后产品卡片、说明书与样例将被清除，且不可恢复。</div>
      ${kv([['产品编号', '<span class="mono">' + esc(p.code) + '</span>'], ['当前状态', badge(PROD_STATUS, p.status)]])}`,
    footer: `<button class="btn" data-act="closeModal">取消</button>
      <button class="btn btn-primary" style="background:#B42318;border-color:#B42318" data-act="delProdOk" data-id="${p.id}">确认删除</button>`
  });
}

function apisHTML(p, compact) {
  const apis = p.apis || [];
  if (!apis.length) return '<div class="mini">暂无接口信息</div>';
  const multi = apis.length > 1;
  return apis.map((a, i) => `<div class="api-blk">
    ${multi ? `<div class="api-blk-hd"><span class="api-ix">${i + 1}</span><span class="api-nm">${esc(a.name)}</span></div>` : ''}
    <div class="api-line"><span class="api-method">${esc(a.method || 'POST')}</span><span class="mono">${esc(a.path)}</span></div>
    ${multi ? '' : ''}
    ${a.desc ? `<div class="doc-sec"><h4>功能说明</h4><p>${esc(a.desc)}</p></div>` : ''}
    ${Array.isArray(a.params) && a.params.length ? `<div class="doc-sec"><h4>请求参数</h4>
      <table class="doc-table"><thead><tr><th>字段</th><th style="width:80px">类型</th><th style="width:60px">必填</th><th>说明</th></tr></thead>
      <tbody>${a.params.map(r => `<tr><td class="mono">${esc(r.name)}</td><td class="mini">${esc(r.type)}</td><td class="mini">${r.req ? '是' : '否'}</td><td class="mini">${esc(r.desc)}</td></tr>`).join('')}</tbody></table>
    </div>` : (typeof a.params === 'string' && a.params ? `<div class="doc-sec"><h4>请求参数</h4><p>${esc(a.params)}</p></div>` : '')}
    ${Array.isArray(a.fields) && a.fields.length ? `<div class="doc-sec"><h4>返回字段</h4>
      <table class="doc-table"><thead><tr><th>字段</th><th style="width:80px">类型</th><th>说明</th></tr></thead>
      <tbody>${a.fields.map(r => `<tr><td class="mono">${esc(r.name)}</td><td class="mini">${esc(r.type)}</td><td class="mini">${esc(r.desc)}</td></tr>`).join('')}</tbody></table>
    </div>` : (typeof a.fields === 'string' && a.fields ? `<div class="doc-sec"><h4>返回字段</h4><p>${esc(a.fields)}</p></div>` : '')}
    ${a.constraint ? `<div class="doc-sec"><h4>使用约束</h4><p>${esc(a.constraint)}</p></div>` : ''}
    ${(!compact && (a.sample || {}).req) ? `<div class="sec-title" style="margin-top:10px">请求样例</div><div class="code">${esc(a.sample.req)}</div>` : ''}
    ${(!compact && (a.sample || {}).res) ? `<div class="sec-title" style="margin-top:10px">返回样例</div><div class="code">${esc(a.sample.res)}</div>` : ''}
  </div>`).join('');
}

function historyHTML(p) {
  const h = p.history || [];
  if (!h.length) return '<div class="mini">暂无审批记录</div>';
  return `<div class="tl">${h.map(x => `<div class="tl-item ${x.action === '审核通过' ? 'ok' : x.action === '审核驳回' ? 'bad' : ''}">
    <div class="tl-at">${esc(x.at)}　·　${esc(x.by)}（${esc(x.role)}）</div>
    <div class="tl-hd"><span class="tl-act">${esc(x.action)}</span></div>
    ${x.note ? `<div class="tl-note">${esc(x.note)}</div>` : ''}
  </div>`).join('')}</div>`;
}

function openProdDetail(id) {
  const p = productOf(id);
  const editable = p.status === 'draft' || p.status === 'rejected';
  modal({
    title: '产品详情 · ' + p.name, width: 760,
    body: `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        ${badge(PROD_STATUS, p.status)}
        <span class="mono mini">${esc(p.code)}</span>
        <span class="mini" style="margin-left:auto">最近更新 ${esc(p.submittedAt || '—')}</span>
      </div>
      ${p.reviewComment ? `<div style="margin-bottom:14px;padding:11px 13px;background:${p.status === 'rejected' ? '#FEF3F2' : '#F5F8FC'};border:1px solid ${p.status === 'rejected' ? '#FBD9D5' : '#E4E9F1'};border-radius:5px;font-size:12.5px;color:${p.status === 'rejected' ? '#B42318' : '#5A6B80'};line-height:1.7"><b>${p.status === 'rejected' ? '驳回原因' : '平台审核意见'}：</b>${esc(p.reviewComment)}</div>` : ''}

      <div class="sec-title">基本信息</div>
      ${kv([
        ['产品名称', esc(p.name)],
        ['交付形态', 'API'],
        ['产品简介', esc(p.desc)],
        ['适用场景', p.scenes.map(x => `<span class="tag">${esc(x)}</span>`).join(' ')]
      ])}

      <div class="sec-title" style="margin-top:16px">API 清单${(p.apis || []).length > 1 ? `（共 ${p.apis.length} 个接口）` : ''}</div>
      ${apisHTML(p)}

      <div class="sec-title" style="margin-top:16px">SDK</div>
      <div style="display:flex;align-items:center;gap:12px;font-size:12.5px;color:#5A6B80">
        <div style="flex:1;min-width:0">
          ${sdkInfo(p).isLink
            ? `<a href="${esc(sdkInfo(p).url)}" target="_blank" rel="noopener" class="sdk-link">${esc(sdkInfo(p).url)}</a>`
            : p.sdk && p.sdk.name ? `<span class="mono">${esc(p.sdk.name)}</span> <span class="mini">${esc(p.sdk.size)}　·　${esc(p.sdk.at)}</span>` : '<span class="mini">未上传</span>'}
        </div>
        ${p.sdk && p.sdk.name ? sdkAnchor(p, 'btn btn-sm') : ''}
      </div>

      <div class="sec-title" style="margin-top:16px">计费方式</div>
      <table>
        <thead><tr><th>档位名称</th><th style="width:80px">月数</th><th style="width:140px">周期内含次数</th><th style="width:130px">超出单价</th></tr></thead>
        <tbody>${p.tiers.map(t => `<tr>
          <td>${esc(t.name)}</td>
          <td class="tnum">${t.months}</td>
          <td class="tnum">${num(t.cap)}</td>
          <td class="tnum">${t.overage} 元/次</td>
        </tr>`).join('')}</tbody>
      </table>

      <div class="sec-title" style="margin-top:16px">审批记录</div>
      ${historyHTML(p)}
`,
    footer: editable
      ? `<button class="btn" data-act="editProd" data-id="${p.id}">编辑</button>
         <button class="btn btn-primary" data-act="closeModal">关闭</button>`
      : `<button class="btn btn-primary" data-act="closeModal">关闭</button>`
  });
}

/* 启动 */
render();
</script>
</body>
</html>
